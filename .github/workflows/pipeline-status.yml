name: Pipeline Status

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday 9am UTC
  workflow_dispatch:

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check pipeline docs
        run: |
          echo "::notice::Pipeline status check complete"
          ls -la pipe-admin/ 2>/dev/null || echo "No pipe-admin yet"
